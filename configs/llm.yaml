# Local LLM configuration (Ollama).
#
# The LLM explains and summarises retrieved evidence. It never classifies, never
# overrides the CNN result, never conceals uncertainty and never invents
# treatment facts.
#
# NOTE: the model tags below are CANDIDATES recorded from the project brief.
# They have NOT yet been verified against the Ollama library. Phase 11 must
# confirm the exact tag, size and licence before anything is pulled.

extends: app.yaml

llm:
  enabled: true
  provider: ollama
  # Internal-only; never published to the host in the app profile.
  base_url: http://ollama:11434
  request_timeout_seconds: 120
  keep_alive: 5m
  # One in-flight request initially; raise only after benchmarking VRAM.
  max_concurrent_requests: 1

  candidates:
    - id: qwen2.5-3b-instruct
      tag: "qwen2.5:3b-instruct"        # UNVERIFIED - confirm in Phase 11
      approx_download_gb: null           # measure before approval
      licence: null                      # record before approval
      verified: false
    - id: gemma3-4b
      tag: "gemma3:4b"                   # UNVERIFIED - confirm in Phase 11
      approx_download_gb: null
      licence: null
      verified: false

  # Selected in Phase 11 after benchmarking; null means CNN-only operation.
  selected: null

  generation:
    temperature: 0.2
    top_p: 0.9
    # Bounded output keeps latency predictable and discourages rambling.
    num_predict: 512
    seed: 1337
    stop: []

  grounding:
    # The model may only use text supplied in the retrieved evidence block.
    require_evidence: true
    # Every claim must cite a knowledge record ID.
    require_citations: true
    # Responses failing schema validation are rejected, not repaired silently.
    validate_schema: true
    max_repair_attempts: 1
    # Refuse rather than answer when no verified record was retrieved.
    refuse_without_evidence: true

  benchmark:
    # Identical grounded cases are replayed against every candidate.
    cases_file: data/reports/llm_benchmark_cases.json
    repeats: 3
    measure:
      - structured_output_validity
      - groundedness
      - instruction_following
      - english_clarity
      - vietnamese_clarity
      - cold_start_seconds
      - warm_response_seconds
      - tokens_per_second
      - vram_mib
      - hallucination_rate
      - unsupported_treatment_claim_rate
