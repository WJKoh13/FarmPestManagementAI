# The locked experimental protocol. This file is the reason the comparison means
# anything: every model, in every notebook, on every machine, trains and is
# scored under exactly these settings.
#
# Changing a value here invalidates every run recorded before the change. If the
# team agrees to change one, bump `protocol_version` and re-run everything --
# `compare.py` refuses to put runs from different protocol versions in the same
# table.

protocol_version: 1

# ---------------------------------------------------------------- dataset ----
dataset:
  manifest_dir: data_manifests
  norm_stats: data_manifests/norm_stats.json

  # Which subset every model trains on. scripts/setup_data.py reads this and
  # nothing else, so switching datasets is a one-line edit here.
  subset: detection_top15

  # How the image is cropped before the transform pipeline sees it.
  #   none -> use the whole image
  #   box  -> crop to the annotated bounding box (subsets that provide one)
  # `margin` expands the box by this fraction of its width/height on each side,
  # so the model still sees a little context and is not fed an edge-to-edge
  # insect. Clipped at the image border.
  crop:
    mode: box
    margin: 0.25

  subsets:
    detection_top15:
      description: >
        Fifteen detection classes screened on image quality rather than raw
        count: classification-training support, annotation coverage, the share
        of images under 224px on the shorter side, and the median fraction of
        the frame the pest occupies. This is the subset ProPestNet trains on
        (see docs/propestnet.md); it is NOT trained under the `training:`
        settings below -- ProPestNet uses 128px and ImageNet normalization,
        recorded here so the app can reproduce its preprocessing exactly.
      source: detection
      images: IP102_v1.1/Detection/VOC2007/JPEGImages
      splits_json: data_manifests/splits_top15.json
      boxes_json: data_manifests/boxes_top15.json
      # Committed, and regenerated in place by scripts/setup_data.py. The app
      # reads it directly, so it must work on a machine with no IP102 images.
      classes_json: data_manifests/classes_top15.json
      # Project label -> original IP102 label (0-based), in list order. The
      # notebook lists these 1-based, because there they index classes.txt.
      original_labels: [14, 15, 16, 18, 22, 23, 24, 37, 45, 47, 51, 69, 70, 86, 101]
      expected_totals: {train: 6748, validation: 1446, test: 1447}
      preprocessing:
        image_size: 128
        mean: [0.485, 0.456, 0.406]     # ImageNet, not this repo's norm_stats.json
        std: [0.229, 0.224, 0.225]
      # KNOWN ISSUE: wireworm (original 16) has 49 images total, 34 of them in
      # train. Its per-class scores are noise, and because macro-F1 weights
      # every class equally it drags the headline metric down on its own. Kept
      # deliberately for taxonomic coverage -- report it, do not hide it.

    rice10:
      description: Ten rice pests from the IP102 classification subset.
      source: classification
      images: IP102_v1.1/Classification/ip102_v1.1
      original_labels: [0, 1, 3, 4, 5, 7, 8, 9, 10, 11]
      expected_totals: {train: 4318, validation: 721, test: 2166}

    all:
      description: Full IP102 classification set, all 102 classes.
      source: classification
      images: IP102_v1.1/Classification/ip102_v1.1
      original_labels: null          # null means "every class in the split files"
      expected_totals: null          # not asserted

# --------------------------------------------------------------- training ----
# Locked. Do not vary these per model -- the architecture must be the only
# difference between two runs.
training:
  image_size: 160
  batch_size: 32
  epochs: 60
  optimizer: adamw
  learning_rate: 0.001
  weight_decay: 0.0001
  loss: weighted_cross_entropy      # inverse-frequency weights; classes are imbalanced
  scheduler: reduce_on_plateau
  scheduler_factor: 0.5
  scheduler_patience: 5
  early_stopping_patience: 10
  seed: 42

# ------------------------------------------------------------- evaluation ----
evaluation:
  primary_metric: macro_f1          # not accuracy -- the classes are imbalanced
  selection_metric: val_macro_f1    # which epoch's weights get kept
  latency_device: cpu               # the app runs offline, so CPU latency is the real cost

# ---------------------------------------------------------------- runtime ----
# Safe to change per machine. Does not affect the comparison.
runtime:
  device: auto                      # cuda -> mps -> cpu
  num_workers: 4
  output_root: runs
