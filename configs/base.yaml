# Base configuration for the Organic Farm Pest Management AI experiment.
#
# Layering: files (via `extends`) < FPA__* environment variables < --set flags.
# Paths are relative to the project root unless absolute, so this file works
# unchanged on Windows and inside a Linux container.
#
# `dataset.num_classes` is NEVER set here. It is derived from `dataset.scope`
# by farm_pest_ai.scopes. Stating a value that contradicts the scope is a hard
# configuration error.

project:
  name: farm-pest-management-ai
  branch: zy_CNN
  description: Offline organic farm pest identification and IPM guidance

paths:
  # Override with FPA__PATHS__DATASET_ROOT or --set paths.dataset_root=...
  dataset_root: ip102_v1.1
  classification_root: ip102_v1.1/Classification
  images_dir: ip102_v1.1/Classification/images
  processed_dir: data/processed
  knowledge_dir: data/knowledge
  reports_dir: data/reports
  manual_evaluation_dir: data/manual_evaluation
  artifacts_dir: artifacts
  # checkpoints_dir, logs_dir, metrics_dir, plots_dir, predictions_dir,
  # exports_dir and model_registry_dir default to subdirectories of
  # artifacts_dir; set them explicitly only to move them elsewhere.

dataset:
  # Active classification scope: rice10 or full102.
  scope: rice10
  image_size: [160, 160]
  # Bumped when derived manifests change meaning.
  manifest_version: 1.0.0
  # Bumped when preprocessing changes in a way that invalidates checkpoints.
  preprocessing_version: 1.0.0
  # Source manifest filenames, relative to classification_root.
  source_manifests:
    train: train.txt
    validation: val.txt
    test: test.txt
  classes_file: classes.txt

preprocessing:
  # Resampling filter used by every resize. Bilinear with antialiasing: the
  # Phase 4 audit measured a median short side of 250-320 px against a 160 px
  # input, so most images are downscaled, where antialiasing matters more than
  # the filter. The 4-10% that are upscaled gain nothing from bicubic beyond
  # sharpened JPEG artefacts.
  interpolation: bilinear
  # null resizes straight to dataset.image_size, keeping the whole frame at the
  # cost of aspect ratio. Set an integer to resize the shorter side and centre
  # crop instead; that preserves aspect ratio but discards the frame edges,
  # where a small insect may sit. Aspect ratios span 0.24-6.04, so cropping
  # would be a real loss. Revisit in Phase 7 against validation macro F1.
  resize_shorter_side: null
  # Fixed normalisation constants, not pretrained weights. Phase 7 may replace
  # them with statistics measured on the training split, which requires bumping
  # dataset.preprocessing_version.
  mean: [0.485, 0.456, 0.406]
  std: [0.229, 0.224, 0.225]
  # TRAINING SPLIT ONLY. Validation and test never see any of this.
  augmentation:
    enabled: true
    random_resized_crop: true
    scale: [0.6, 1.0]
    ratio: [0.75, 1.3333]
    horizontal_flip: 0.5
    # Off: most photographs are ground-referenced, so an inverted insect is not
    # a realistic input.
    vertical_flip: 0.0
    rotation_degrees: 15.0
    color_jitter_brightness: 0.2
    color_jitter_contrast: 0.2
    color_jitter_saturation: 0.2
    # Kept small: pest identification leans on colour, and a large hue shift
    # destroys the signal it depends on.
    color_jitter_hue: 0.02
    random_erasing: 0.0

reproducibility:
  seed: 1337
  deterministic: true
  cudnn_benchmark: false

logging:
  level: INFO
  json_lines: true

runtime:
  # auto resolves to cuda when available, otherwise cpu.
  device: auto
  num_workers: 8
  pin_memory: true
  persistent_workers: true
  prefetch_factor: 4
  # Training only. A short final batch gives BatchNorm too little to normalise
  # over. Evaluation loaders never drop, so every image is scored exactly once.
  drop_last: true
  amp: true
