# E4B - detection top10, BOUNDING-BOX CROP with 15% padding.
#
# The treatment arm of the E4 pair. Each image is cropped to its bounding box
# grown by 15% of the box's own width and height on every side and clamped to
# the image boundary; the normal resize, augmentation and normalisation then run
# on the crop exactly as they do on the full frame in E4A.
#
# Differs from exp_det_top10_e4a_fullframe.yaml in exactly one field:
# `dataset.use_bbox_crop`.
#
#   scripts/train.py --config model_custom.yaml --config exp_det_top10_e4b_crop15.yaml

extends: exp_detection_protocol.yaml

dataset:
  scope: det_top10
  use_bbox_crop: true
