# rice10 scope: ten-class rice pest subset of IP102.
#
# The project-label -> IP102-label mapping lives in farm_pest_ai.scopes and is
# NOT restated here; duplicating it would create two sources of truth. The
# counts below are expectations verified in Phase 1 and re-checked by
