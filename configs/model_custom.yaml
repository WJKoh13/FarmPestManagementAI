# Model B: primary custom CNN.
#
# Manually implemented residual and depthwise-separable blocks, written from
# primitive PyTorch layers. torchvision.models, prebuilt architectures,
# pretrained weights and downloaded checkpoints are all prohibited.
#
# `num_classes` is absent by design: it is derived from dataset.scope.

extends: base.yaml

model:
  name: custom_cnn
  stem_channels: 32
  # Per-stage output channels, block counts and strides.
  stage_channels: [64, 128, 256, 384]
  stage_blocks: [2, 2, 3, 2]
  stage_strides: [2, 2, 2, 2]
  block: residual_separable
  se_ratio: 0.25
  dropout: 0.3
  drop_path: 0.1
  activation: silu
  norm: batchnorm
  head: global_avg_pool

training:
  optimizer: adamw
  learning_rate: 0.002
  weight_decay: 0.05
  # 64 keeps peak VRAM well inside the ~4 GB free on the RTX 4070 Laptop
  # measured in Phase 1; raise only after confirming free memory.
  batch_size: 64
  epochs: 80
  scheduler: cosine
  warmup_epochs: 5
  label_smoothing: 0.1
  class_weighting: none
  grad_clip_norm: 1.0
  early_stopping:
    metric: macro_f1
    mode: max
    patience: 15
    min_delta: 0.001
  checkpoint:
    save_best: true
    save_last: true
    monitor: macro_f1
