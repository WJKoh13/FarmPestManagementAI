# E5A - detection top15, FULL-FRAME control.
#
# The control arm of the E5 pair: the E4A treatment applied to the fifteen-class
# detection scope. Loads the original JPEG; no bounding box is read.
#
# Paired with exp_det_top15_e5b_crop15.yaml, differing in exactly one field:
# `dataset.use_bbox_crop`.
#
#   scripts/train.py --config model_custom.yaml --config exp_det_top15_e5a_fullframe.yaml

extends: exp_detection_protocol.yaml

dataset:
  scope: det_top15
  use_bbox_crop: false
