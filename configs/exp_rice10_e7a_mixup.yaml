# Phase 8.1 experiment E7a: MixUp.
#
# THE ONE VARIABLE: training.mixing.method none -> mixup.
#
# MixUp trains on convex blends of image pairs against the correspondingly
# blended target. It attacks the specific failure the E0 curves show — a model
# that fits its training set to 0.88 accuracy while reaching 0.61 on validation —
# by removing the model's ability to memorise individual images, since almost no
# training image is ever presented unmodified.
#
# alpha 0.2 draws lambda from Beta(0.2, 0.2), which concentrates near 0 and 1:
# most batches are only slightly mixed and a minority are strongly mixed. This is
# the conservative published setting and the right starting point for a 4,318-image
# training set, where alpha 1.0's uniform lambda would leave the model rarely
# seeing a clean image.
#
# LABEL SMOOTHING IS DELIBERATELY UNCHANGED at the E0 value of 0.1. MixUp and
# label smoothing are both target-softening mechanisms and it is tempting to
# reduce one when adding the other — but doing so would make E7a a two-variable
# experiment, and the phase requires the interaction to be stated rather than
# silently traded off. The mixed loss applies the configured smoothing inside
# each of its two cross-entropy terms, which is mathematically identical to one
# cross-entropy against the smoothed, lambda-blended target.
#
# Training only. Validation preprocessing is untouched and deterministic, and
# metrics are accumulated against the ORIGINAL hard labels, so this arm's
# validation figures are directly comparable with E0's.
#
# Usage:
#   scripts/train.py --config model_custom.yaml \
#       --config exp_rice10_e7a_mixup.yaml --plan

extends: exp_rice10_protocol_a.yaml

training:
  mixing:
    method: mixup
    alpha: 0.2
    probability: 1.0
