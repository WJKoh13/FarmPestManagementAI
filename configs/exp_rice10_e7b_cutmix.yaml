# Phase 8.1 experiment E7b: CutMix.
#
# THE ONE VARIABLE: training.mixing.method none -> cutmix.
#
# CutMix pastes a rectangle from one image over another and weights the target by
# the pasted area. Where MixUp blends globally and produces images unlike any
# real photograph, CutMix keeps every pixel a real pixel and instead forces the
# model to classify from partial evidence — which is closer to the failure mode
# this dataset actually has. Phase 7.3's contact sheets showed tiny subjects,
# multi-panel composites and symptom-only frames, so "recognise the pest from
# part of the frame" is a real requirement rather than a synthetic one.
#
# alpha 1.0 gives a uniform lambda and therefore a uniformly distributed box
# area. This is the published CutMix setting and differs from E7a's 0.2 for a
# reason: CutMix's occlusion is far less destructive per unit lambda than MixUp's
# global blend, since the un-pasted region remains a clean image.
#
# The implementation corrects lambda using the ACTUAL clipped box area. The box
# centre is uniform over the image, so boxes routinely extend past an edge; using
# the lambda that sized the box would supervise a blend the pixels do not show.
#
# LABEL SMOOTHING IS DELIBERATELY UNCHANGED, for the same reason as E7a.
#
# Training only. Validation preprocessing is untouched and metrics are scored
# against the original hard labels.
#
# Usage:
#   scripts/train.py --config model_custom.yaml \
#       --config exp_rice10_e7b_cutmix.yaml --plan

extends: exp_rice10_protocol_a.yaml

training:
  mixing:
    method: cutmix
    alpha: 1.0
    probability: 1.0
