# Phase 8.1 experiment E8: supervised contrastive auxiliary objective.
#
# THE ONE VARIABLE: training.fine_grained.method none -> supcon.
#
# The E0 confusion matrix shows the residual errors are STRUCTURED, not diffuse:
# the three plant hoppers confuse one another 16-25% each way, the two borers
# swap 12-16%, and rice leaf caterpillar leaks 21% into rice leaf roller. Those
# are genuinely similar-looking taxa, and cross-entropy has no term that asks the
# representation to separate them — it only asks that the correct logit be
# largest. The auxiliary term supplies exactly that missing pressure.
#
# WHY SUPERVISED CONTRASTIVE RATHER THAN TRIPLET MARGIN. Measured on the real
# rice10 training distribution at batch size 64: ~9.94 of 10 classes appear per
# batch and each anchor has ~7 same-class partners. SupCon consumes every one of
# those positives and every negative in a single term. Triplet loss would need a
# mining strategy to choose among them and would discard most of the batch. The
# choice follows from the data, and no sampler change is required — which matters,
# because introducing balanced sampling here would make E8 a two-variable
# experiment.
#
# THE INFERENCE CONTRACT IS UNCHANGED. forward() still returns raw class logits.
# The embedding comes from a separate forward_features() path and a projection
# head that exists only during training, is not part of the model's state_dict,
# and is never consulted by a prediction. An E8 checkpoint loads into the ordinary
# inference path with no special case.
#
# Total objective: cross_entropy + 0.1 * supervised_contrastive
#
# weight 0.1 keeps the auxiliary term a correction to the classification
# objective rather than a competing one. temperature 0.07 is the published SupCon
# value. embedding_dim 128 against a 384-wide pooled feature is the usual
# compression ratio.
#
# Usage:
#   scripts/train.py --config model_custom.yaml \
#       --config exp_rice10_e8_supcon.yaml --plan

extends: exp_rice10_protocol_a.yaml

training:
  fine_grained:
    method: supcon
    weight: 0.1
    temperature: 0.07
    embedding_dim: 128
    mining: all_positives
