[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "farm-pest-ai"
version = "0.2.0"
description = "Offline organic farm pest identification and IPM guidance (experimental zy_CNN branch)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Proprietary" }

# Version floors only. The exact resolved versions provisioned in Phase 3 -
# including the PyTorch CUDA 12.6 build, which is not on PyPI - live in
# requirements-lock.txt and are what the container build must reproduce.
dependencies = [
  "pyyaml>=6.0",
  "numpy>=1.26",
  "pillow>=10.0",
]

[project.optional-dependencies]
train = [
  "torch>=2.2",
  "torchvision>=0.17",
  "scikit-learn>=1.4",
  "pandas>=2.0",
  "matplotlib>=3.8",
  "tqdm>=4.66",
]
app = [
  "fastapi>=0.110",
  "uvicorn[standard]>=0.29",
  "streamlit>=1.33",
  "pydantic>=2.6",
  "httpx>=0.27",
  "python-multipart>=0.0.9",
]
dev = [
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "ruff>=0.4",
  "mypy>=1.9",
]

# Console entry points are deliberately absent: scripts are invoked as
# `python scripts/<name>.py --help`, which works from a bare checkout and
# inside the container without an editable install.

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra --strict-markers --strict-config"
markers = [
  "slow: tests that take more than a few seconds",
  "gpu: tests that require CUDA",
  "dataset: tests that require the local IP102 dataset",
]
filterwarnings = ["error::DeprecationWarning:farm_pest_ai.*"]

[tool.ruff]
line-length = 95
target-version = "py310"
src = ["src", "scripts", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "SIM", "PTH", "RUF", "D"]
ignore = [
  "D203",  # conflicts with D211
  "D213",  # conflicts with D212
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["D100", "D103"]
"scripts/*" = ["D100"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.mypy]
python_version = "3.10"
mypy_path = "src"
packages = ["farm_pest_ai"]
warn_unused_configs = true
warn_redundant_casts = true
no_implicit_optional = true
ignore_missing_imports = true
