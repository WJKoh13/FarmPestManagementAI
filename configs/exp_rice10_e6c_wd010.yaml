# Phase 8.1 experiment E6c: stronger weight decay. STAGE 2 — CONDITIONAL.
#
# This arm is run ONLY IF stage 1 (E6a/E6b) produces a meaningful learning-rate
# winner, and it is then layered on top of that winner rather than on the E0
# control. Running it unconditionally would make it a second independent probe of
# an unpromising region and would waste the compute the staged design exists to
# save.
#
# THE ONE VARIABLE: training.weight_decay 0.05 -> 0.10.
#
# Weight decay is the other half of the AdamW pairing that risk 22 flags as
# untuned. 0.05 is already high for a 1.4M-parameter model; doubling it is the
# natural next probe given the observed train-validation gap, and it is a pure
# regulariser, so a gain here is direct evidence about generalization rather than
# about optimisation speed.
#
# The zero-decay group for norms and biases is unchanged: build_optimizer keeps
# BatchNorm scales and biases out of the decayed group regardless of this value,
# so raising it does not start suppressing normalisation channels.
#
# NOTE — if stage 1 selects a non-control learning rate, this file must be
# layered AFTER that arm's config so both settings apply:
#   scripts/train.py --config model_custom.yaml \
#       --config exp_rice10_e6a_lr0008.yaml \
#       --config exp_rice10_e6c_wd010.yaml --plan
# Layered on its own it changes weight decay against the E0 control, which is
# the correct comparison only if stage 1 found no winner.

extends: exp_rice10_protocol_a.yaml

training:
  weight_decay: 0.10
