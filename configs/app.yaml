# Application configuration for the FastAPI backend and Streamlit frontend.
#
# The active scope and num_classes come from the loaded checkpoint, not from
# this file. A checkpoint whose scope disagrees with dataset.scope is rejected
# at start-up rather than served.

extends: base.yaml

api:
  host: 0.0.0.0
  port: 8000
  root_path: ""
  cors_origins: []
  max_upload_bytes: 10485760  # 10 MiB
  allowed_content_types: [image/jpeg, image/png, image/webp]
  request_timeout_seconds: 60

inference:
  # Path to the frozen checkpoint; set in Phase 9.
  checkpoint: null
  top_k: 5
  batch_size: 1
  device: auto

uncertainty:
  # Provisional thresholds. Calibrated in Phase 9 on VALIDATION data only, then
  # frozen. Never tuned against the test set.
  min_confidence: 0.55
  # Flag when the top two classes are too close to separate.
  min_margin: 0.10
  # Flag when the predictive distribution is too flat (normalised entropy).
  max_normalized_entropy: 0.75
  # Copy shown to the farmer when any rule above fires.
  uncertain_message: >-
    This identification is not reliable enough to act on. Please review the
    alternatives, take another photo in better light and closer to the pest,
    or consult a local agricultural extension officer.

knowledge:
  database: data/knowledge/knowledge.sqlite3
  # Deterministic retrieval by class ID is preferred over similarity search.
  retrieval: by_class_id
  # When a predicted class has no verified record, return identification only.
  allow_unverified_guidance: false

safety:
  # Withhold class-specific treatment guidance while the prediction is
  # uncertain. Identification and alternatives are still shown.
  suppress_treatment_when_uncertain: true
  require_jurisdiction_for_organic_claims: true
  require_source_for_dosage: true
  # The system must keep working with CNN-only output if Ollama is down.
  degrade_gracefully_without_llm: true

frontend:
  host: 0.0.0.0
  port: 8501
  api_base_url: http://localhost:8000
  enable_camera_input: true

evaluation:
  database: data/manual_evaluation/reviews.sqlite3
  export_dir: data/manual_evaluation
